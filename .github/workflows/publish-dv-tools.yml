name: Publish dv-tools

on:
  push:
    tags:
      - 'dv-tools/v*'   # e.g. dv-tools/v1.2.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish; must equal packages/dv-tools/package.json, and the workflow must run from the tag dv-tools/v<version>'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@powerbipro-eu'

      - name: Install yarn
        run: npm install -g yarn

      # The committed package.json version is what gets published. The workflow must run from
      # the tag dv-tools/v<version> (and a dispatch input must name the same version).
      - name: Check the tag matches package.json
        working-directory: packages/dv-tools
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || '' }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$REF_TYPE" != "tag" ] || [ "${REF_NAME#dv-tools/v}" = "$REF_NAME" ]; then
            echo "::error::Run the workflow from a release tag dv-tools/v<version>, not ${REF_TYPE} '${REF_NAME}'"
            exit 1
          fi
          TAG_VERSION="${REF_NAME#dv-tools/v}"
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "$TAG_VERSION" ]; then
            echo "::error::The requested version '${REQUESTED}' is not the tag's '${TAG_VERSION}'"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${REF_NAME} does not match packages/dv-tools/package.json version '${PKG_VERSION}'"
            exit 1
          fi
          echo "Publishing @powerbipro-eu/dv-tools ${PKG_VERSION}"

      # Use yarn (the workspace manager) with --ignore-scripts so workspace
      # member prepare/build hooks don't run — we only need node_modules symlinks.
      - name: Install workspace dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      # dbml-parse is a workspace dep of dv-tools. Its dist directory is gitignored,
      # so we must build it before dv-tools. build:parser output is already committed
      # to git, so we only need vite.
      - name: Build dbml-parse
        working-directory: packages/dbml-parse
        run: npx vite build

      - name: Test dv-tools
        working-directory: packages/dv-tools
        run: yarn test

      - name: Build dv-tools
        working-directory: packages/dv-tools
        run: npx vite build

      - name: Check built CLI reports the version
        working-directory: packages/dv-tools
        run: |
          BUILT=$(node dist/cli.mjs --version)
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$BUILT" != "$PKG_VERSION" ]; then
            echo "::error::dist/cli.mjs --version printed '${BUILT}', expected '${PKG_VERSION}'"
            exit 1
          fi

      - name: Publish to GitHub Packages
        working-directory: packages/dv-tools
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
