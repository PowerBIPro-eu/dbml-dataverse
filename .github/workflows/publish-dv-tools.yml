name: Publish dv-tools

on:
  push:
    tags:
      - 'dv-tools/v*'   # e.g. dv-tools/v1.2.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish; must equal packages/dv-tools/package.json (run from the release tag)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@powerbipro-eu'

      - name: Install yarn
        run: npm install -g yarn

      # The committed package.json version is what gets published. The tag (or the
      # dispatch input) must name exactly that version, otherwise nothing is published.
      - name: Check requested version matches package.json
        working-directory: packages/dv-tools
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          REQUESTED="${REQUESTED#dv-tools/v}"
          if [ "$REQUESTED" != "$PKG_VERSION" ]; then
            echo "::error::Requested version '${REQUESTED}' does not match packages/dv-tools/package.json version '${PKG_VERSION}'"
            exit 1
          fi
          echo "Publishing version ${PKG_VERSION}"

      # Use yarn (the workspace manager) with --ignore-scripts so workspace
      # member prepare/build hooks don't run — we only need node_modules symlinks.
      - name: Install workspace dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      # dbml-parse and dbml-core are workspace deps of dv-tools. Their dist/lib
      # directories are gitignored, so we must build them before dv-tools.
      # build:parser output is already committed to git, so we only need vite.
      - name: Build dbml-parse
        working-directory: packages/dbml-parse
        run: npx vite build

      - name: Build dbml-core
        working-directory: packages/dbml-core
        run: npx vite build

      - name: Test dv-tools
        working-directory: packages/dv-tools
        run: yarn test

      - name: Build dv-tools
        working-directory: packages/dv-tools
        run: npx vite build

      - name: Check built CLI reports the version
        working-directory: packages/dv-tools
        run: |
          BUILT=$(node dist/cli.mjs --version)
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$BUILT" != "$PKG_VERSION" ]; then
            echo "::error::dist/cli.mjs --version printed '${BUILT}', expected '${PKG_VERSION}'"
            exit 1
          fi

      - name: Publish to GitHub Packages
        working-directory: packages/dv-tools
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
